services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zbank
      POSTGRES_PASSWORD: zbank_dev_only
      POSTGRES_DB: zbank
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zbank -d zbank"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # UI web
      - "1025:1025" # SMTP

volumes:
  pgdata:
